<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">NeonInk dataset profile</title><desc id="desc">Synthetic dataset profile with record count, unknown validation, schema and provenance limitations.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1440" height="960" rx="0" fill="#050816"/><rect x="48" y="44" width="40" height="4" rx="0" fill="#22D3EE"/><text x="104" y="55" fill="#94A3B8" font-size="15" font-weight="600">NEONINK / DATA PRESENTATION / 0.2</text><text x="48" y="132" fill="#E5E7EB" font-size="40" font-weight="600">A dataset profile with context intact</text><text x="48" y="174" fill="#94A3B8" font-size="19" font-weight="400">Demonstration collection / v0.0-fixture / synthetic records</text><rect x="48" y="216" width="432" height="156" rx="12" fill="#111827"/><text x="72" y="254" fill="#22D3EE" font-size="15" font-weight="600">RECORDS</text><text x="72" y="306" fill="#E5E7EB" font-size="36" font-weight="600">1,200</text><text x="72" y="344" fill="#94A3B8" font-size="17" font-weight="400">Five source families</text><rect x="504" y="216" width="432" height="156" rx="12" fill="#111827"/><text x="528" y="254" fill="#22D3EE" font-size="15" font-weight="600">COVERAGE WINDOW</text><text x="528" y="306" fill="#E5E7EB" font-size="36" font-weight="600">6 months</text><text x="528" y="344" fill="#94A3B8" font-size="17" font-weight="400">Illustrative period only</text><rect x="960" y="216" width="432" height="156" rx="12" fill="#111827"/><text x="984" y="254" fill="#22D3EE" font-size="15" font-weight="600">VALIDATION</text><text x="984" y="306" fill="#E5E7EB" font-size="36" font-weight="600">Unknown</text><text x="984" y="344" fill="#94A3B8" font-size="17" font-weight="400">No production checks supplied</text><rect x="48" y="396" width="844" height="442" rx="12" fill="#111827"/><text x="76" y="440" fill="#E5E7EB" font-size="24" font-weight="600">Schema sample</text><text x="76" y="492" fill="#22D3EE" font-size="18" font-weight="400">Field</text><text x="306" y="492" fill="#CBD5E1" font-size="18" font-weight="400">Type</text><text x="480" y="492" fill="#CBD5E1" font-size="17" font-weight="400">Meaning</text><path d="M76 510 L864 510" fill="none" stroke="#64748B"/><text x="76" y="550" fill="#E5E7EB" font-size="18" font-weight="400">record_id</text><text x="306" y="550" fill="#CBD5E1" font-size="18" font-weight="400">string</text><text x="480" y="550" fill="#CBD5E1" font-size="17" font-weight="400">Stable source identifier</text><path d="M76 568 L864 568" fill="none" stroke="#64748B"/><text x="76" y="608" fill="#E5E7EB" font-size="18" font-weight="400">family</text><text x="306" y="608" fill="#CBD5E1" font-size="18" font-weight="400">enum</text><text x="480" y="608" fill="#CBD5E1" font-size="17" font-weight="400">Source family label</text><path d="M76 626 L864 626" fill="none" stroke="#64748B"/><text x="76" y="666" fill="#E5E7EB" font-size="18" font-weight="400">observed_at</text><text x="306" y="666" fill="#CBD5E1" font-size="18" font-weight="400">date</text><text x="480" y="666" fill="#CBD5E1" font-size="17" font-weight="400">Observation date</text><path d="M76 684 L864 684" fill="none" stroke="#64748B"/><text x="76" y="724" fill="#E5E7EB" font-size="18" font-weight="400">value</text><text x="306" y="724" fill="#CBD5E1" font-size="18" font-weight="400">number | null</text><text x="480" y="724" fill="#CBD5E1" font-size="17" font-weight="400">Measured value; null is missing</text><path d="M76 742 L864 742" fill="none" stroke="#64748B"/><rect x="916" y="396" width="476" height="442" rx="12" fill="#0B0F1A"/><text x="944" y="443" fill="#E5E7EB" font-size="24" font-weight="600">Before interpreting</text><text x="944" y="494" fill="#94A3B8" font-size="17" font-weight="400">Coverage is not representativeness.</text><text x="944" y="533" fill="#94A3B8" font-size="17" font-weight="400">Missing values remain explicit.</text><text x="944" y="572" fill="#94A3B8" font-size="17" font-weight="400">No license for a real corpus is implied.</text><text x="944" y="634" fill="#FACC15" font-size="17" font-weight="400">PROVENANCE</text><text x="944" y="672" fill="#94A3B8" font-size="17" font-weight="400">Local synthetic fixture; no private data.</text><text x="944" y="711" fill="#94A3B8" font-size="17" font-weight="400">Inspect the companion JSON for values.</text><text x="944" y="775" fill="#94A3B8" font-size="17" font-weight="400">A pilot still needs real source evidence.</text><path d="M48 888 L1392 888" fill="none" stroke="#64748B"/><text x="48" y="921" fill="#94A3B8" font-size="16" font-weight="400">SYNTHETIC DESIGN FIXTURE • Not production metrics • Source: examples/reference-data.json</text></g></svg>
