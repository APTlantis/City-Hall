<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">NeonInk color scale guide</title><desc id="desc">Three labeled palettes: categorical identity, increasing lightness sequential cyan, and violet neutral cyan divergence. Missing data is separate.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1440" height="960" rx="0" fill="#050816"/><rect x="48" y="44" width="40" height="4" rx="0" fill="#22D3EE"/><text x="104" y="55" fill="#94A3B8" font-size="15" font-weight="600">NEONINK / DATA PRESENTATION / 0.2</text><text x="48" y="132" fill="#E5E7EB" font-size="40" font-weight="600">Three color systems. Three different jobs.</text><text x="48" y="174" fill="#94A3B8" font-size="19" font-weight="400">Series identity, ordered magnitude, and deviation from a meaningful center</text><rect x="48" y="218" width="1344" height="190" rx="10" fill="#111827"/><text x="76" y="258" fill="#E5E7EB" font-size="24" font-weight="600">01  Categorical</text><text x="420" y="257" fill="#94A3B8" font-size="18" font-weight="400">Stable series keys; pair each hue with labels or distinct marks.</text><rect x="76" y="282" width="236" height="60" rx="5" fill="#22D3EE"/><text x="76" y="373" fill="#CBD5E1" font-size="17" font-weight="400">#22D3EE</text><text x="206" y="373" fill="#94A3B8" font-size="15" font-weight="400">A • circle</text><rect x="336" y="282" width="236" height="60" rx="5" fill="#A78BFA"/><text x="336" y="373" fill="#CBD5E1" font-size="17" font-weight="400">#A78BFA</text><text x="466" y="373" fill="#94A3B8" font-size="15" font-weight="400">B • square</text><rect x="596" y="282" width="236" height="60" rx="5" fill="#F472B6"/><text x="596" y="373" fill="#CBD5E1" font-size="17" font-weight="400">#F472B6</text><text x="726" y="373" fill="#94A3B8" font-size="15" font-weight="400">C • triangle</text><rect x="856" y="282" width="236" height="60" rx="5" fill="#F97316"/><text x="856" y="373" fill="#CBD5E1" font-size="17" font-weight="400">#F97316</text><text x="986" y="373" fill="#94A3B8" font-size="15" font-weight="400">D • diamond</text><rect x="1116" y="282" width="236" height="60" rx="5" fill="#818CF8"/><text x="1116" y="373" fill="#CBD5E1" font-size="17" font-weight="400">#818CF8</text><text x="1246" y="373" fill="#94A3B8" font-size="15" font-weight="400">E • cross</text><rect x="48" y="428" width="1344" height="190" rx="10" fill="#111827"/><text x="76" y="468" fill="#E5E7EB" font-size="24" font-weight="600">02  Sequential</text><text x="420" y="467" fill="#94A3B8" font-size="18" font-weight="400">Low → high; increasing lightness. Publish numeric bin boundaries.</text><rect x="76" y="492" width="236" height="60" rx="5" fill="#164E63"/><text x="76" y="583" fill="#CBD5E1" font-size="17" font-weight="400">#164E63</text><text x="206" y="583" fill="#94A3B8" font-size="15" font-weight="400">Low</text><rect x="336" y="492" width="236" height="60" rx="5" fill="#0E7490"/><text x="336" y="583" fill="#CBD5E1" font-size="17" font-weight="400">#0E7490</text><text x="466" y="583" fill="#94A3B8" font-size="15" font-weight="400">2</text><rect x="596" y="492" width="236" height="60" rx="5" fill="#0891B2"/><text x="596" y="583" fill="#CBD5E1" font-size="17" font-weight="400">#0891B2</text><text x="726" y="583" fill="#94A3B8" font-size="15" font-weight="400">3</text><rect x="856" y="492" width="236" height="60" rx="5" fill="#22D3EE"/><text x="856" y="583" fill="#CBD5E1" font-size="17" font-weight="400">#22D3EE</text><text x="986" y="583" fill="#94A3B8" font-size="15" font-weight="400">4</text><rect x="1116" y="492" width="236" height="60" rx="5" fill="#A5F3FC"/><text x="1116" y="583" fill="#CBD5E1" font-size="17" font-weight="400">#A5F3FC</text><text x="1246" y="583" fill="#94A3B8" font-size="15" font-weight="400">High</text><rect x="48" y="638" width="1344" height="190" rx="10" fill="#111827"/><text x="76" y="678" fill="#E5E7EB" font-size="24" font-weight="600">03  Diverging</text><text x="420" y="677" fill="#94A3B8" font-size="18" font-weight="400">Below → center → above. Sign alone does not mean good or bad.</text><rect x="76" y="702" width="236" height="60" rx="5" fill="#A78BFA"/><text x="76" y="793" fill="#CBD5E1" font-size="17" font-weight="400">#A78BFA</text><text x="206" y="793" fill="#94A3B8" font-size="15" font-weight="400">Below</text><rect x="336" y="702" width="236" height="60" rx="5" fill="#C4B5FD"/><text x="336" y="793" fill="#CBD5E1" font-size="17" font-weight="400">#C4B5FD</text><text x="466" y="793" fill="#94A3B8" font-size="15" font-weight="400">Below</text><rect x="596" y="702" width="236" height="60" rx="5" fill="#E5E7EB"/><text x="596" y="793" fill="#CBD5E1" font-size="17" font-weight="400">#E5E7EB</text><text x="726" y="793" fill="#94A3B8" font-size="15" font-weight="400">Center</text><rect x="856" y="702" width="236" height="60" rx="5" fill="#67E8F9"/><text x="856" y="793" fill="#CBD5E1" font-size="17" font-weight="400">#67E8F9</text><text x="986" y="793" fill="#94A3B8" font-size="15" font-weight="400">Above</text><rect x="1116" y="702" width="236" height="60" rx="5" fill="#22D3EE"/><text x="1116" y="793" fill="#CBD5E1" font-size="17" font-weight="400">#22D3EE</text><text x="1246" y="793" fill="#94A3B8" font-size="15" font-weight="400">Above</text><text x="48" y="872" fill="#CBD5E1" font-size="18" font-weight="400">Missing = gap or hatch + “No data”. Status = explicit label + evidence. Neither is a scale midpoint.</text><path d="M48 888 L1392 888" fill="none" stroke="#64748B"/><text x="48" y="921" fill="#94A3B8" font-size="16" font-weight="400">SYNTHETIC DESIGN FIXTURE • Not production metrics • Source: examples/reference-data.json</text></g></svg>
