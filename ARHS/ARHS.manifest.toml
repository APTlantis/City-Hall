[standard]
id = "aptlantis-release-hashing-standard"
title = "APTlantis Release Hashing Standard"
abbreviation = "ARHS"
status = "active"
maturity = "candidate"
version = "0.3.0"
description = "Governs release hash manifests for Aptlantis release artifacts, including SHA256, BLAKE3-256, KT128, distribution channel, and signing/provenance authority."

[governance]
meta_standard = "SFDS"
workspace_standard = "WGS"
scope = "Required release hash manifests and verification records for Aptlantis release artifacts."
non_goals = ["Archive preservation manifests", "project proposal creation", "release packaging procedure", "cryptographic signature generation"]

[artifacts]
specification = "APTlantis Release Hashing Standard.md"
schema = "ReleaseHashRecord.schema.toml"
templates = "templates"
examples = "examples"
adoption_guide = "Adoption-Guide.md"
validation_checklist = "Validation-Checklist.md"
changelog = "CHANGELOG.md"
validators = []
governance_notes = []
reference_examples = ["examples/sample-hashes.txt", "examples/Example-Release-Hash-Record.md"]

[adopter_artifacts]
schemas = ["ReleaseHashRecord.schema.toml"]
manifest_templates = []
document_templates = ["templates/Release-Hash-Record.md"]

[lifecycle]
created = "2026-06-10"
last_updated = "2026-08-20"
maintainer = "Herb"

[promotion]
promotion_state = "candidate-active-library-copy"
promotion_authority = "D:\\.city_hall"
active_copy = "D:\\.city_hall\\ARHS"
promotion_date = "2026-08-20"
notes = "Promoted after ReleaseHasher established the single-artifact release hash manifest workflow. City Hall retains the historical candidate lineage."

[agent]
read_first = ["APTlantis Release Hashing Standard.md", "ARHS.manifest.toml"]
notes = "Use ARHS for release hash manifests. Use ReleaseHasher for single-artifact .hashmanifest.toml generation when practical. Use AAMHS and ArchiveHasher/manifest-signer.exe for archive preservation integrity and detached signatures."
