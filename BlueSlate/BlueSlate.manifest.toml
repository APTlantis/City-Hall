known_gaps = ["More real adopter evidence is needed before stable maturity.", "The Bootstrap 5.3 profile still needs rendered adopter evidence before stable maturity.", "WPF/WinUI starter packs are partial pilots; SiYuan mapping requires in-app state verification."]
technical_debt = "Earlier project-style records are preserved for lineage while README.md is now the standard-suite front door."

[agent]
read_first = ["README.md", "BlueSlate.manifest.toml", "AGENTS.md", "Project-README.md", "spec/tokens/BlueSlate.Tokens.toml", "spec/BlueSlate.DesignSystem.md"]
governing_context = "Read D:\\AGENTS.md plus this standard record; consult City Hall, NeonInk, and SESM before changing promotion status, design-system semantics, or visual metadata."
safe_to_modify = true
notes = "Blue Slate is candidate active after the 2026-07-25 City Hall promotion record; record adoption level in each adopting project."
