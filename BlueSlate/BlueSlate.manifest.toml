framework_notes = ["spec/frameworks/BlueSlate.Tailwind.md", "spec/frameworks/BlueSlate.TauriReact.md", "spec/frameworks/BlueSlate.SiYuan.md", "spec/frameworks/BlueSlate.WinUI.md", "spec/frameworks/BlueSlate.WPF.md", "spec/frameworks/BlueSlate.Bootstrap53.md"]
