validators = ["tools/compile_blueslate.py", "tools/Test-BlueSlate.ps1", "tools/Audit-BlueSlate.ps1", "tools/test_compiler.py", "tools/validate_suite.py", "spec/frameworks/validate_bootstrap53_profile.py"]
