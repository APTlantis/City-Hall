[meta]
schema = "aptlantis.blue-slate.tokens"
schema_version = "1.0"
version = "0.5.0"
name = "Aptlantis Blue Slate"
source_format = "dual-hex-and-oklch-toml"
theme_mode = "dark-only"
candidate_active = true
generated_notice = "Generated translations must identify this source file and version."

[policy]
canonical_layers = ["palette", "semantic", "component", "foundation", "typography"]
framework_names_are_canonical = false
raw_colors_require_semantic_mapping = true
bootstrap_status = "legacy-reference-only"
color_migration = "exact-srgb-to-oklch; retuning requires a separately reviewed change"

# Every palette token deliberately carries both forms: `hex` preserves the original
# sRGB value and `oklch` enables perceptual edits. Neither form is discarded.
[palette.abyss]
hex = "#050913"
oklch = "oklch(0.140499 0.023636 263.451)"
role = "deepest background and primary canvas"
[palette.deep-navy]
hex = "#0B1728"
oklch = "oklch(0.203331 0.038347 257.213)"
role = "soft background and recessed canvas"
[palette.navy]
hex = "#172536"
