title = "Desktop Application Release Standard — Project Manifest Schema v1.0"
type = "object"
required = ["project", "metadata", "runtime", "release"]

# ─────────────────────────────────────────────────────────────────────────────
# PROJECT
# ─────────────────────────────────────────────────────────────────────────────

[properties.project]
type = "object"
required = ["id", "title", "type", "stage"]

[properties.project.properties.id]
type = "string"
pattern = "[a-z0-9\\-_]"
description = "Unique machine-friendly project identifier (lowercase, kebab-case)"

[properties.project.properties.title]
type = "string"
description = "Human-readable project name"

[properties.project.properties.description]
type = "string"
description = "One-sentence description of what this application does"

[properties.project.properties.type]
type = "string"
enum = [
  "service",
  "tool",
  "generator",
  "pipeline",
  "library",
  "dataset",
  "ui",
  "dashboard",
  "infrastructure"
]

[properties.project.properties.stage]
type = "string"
enum = [
  "concept",
  "prototype",
  "active",
  "near-complete",
  "production",
  "archived"
]

[properties.project.properties.version]
type = "string"
description = "Current semantic version (MAJOR.MINOR.PATCH) — must match release.version"

[properties.project.properties.tags]
type = "array"

[properties.project.properties.tags.items]
type = "string"

# ─────────────────────────────────────────────────────────────────────────────
# METADATA
# ─────────────────────────────────────────────────────────────────────────────

[properties.metadata]
type = "object"
required = ["created", "language_primary"]

[properties.metadata.properties.created]
type = "string"
format = "date"

[properties.metadata.properties.last_updated]
type = "string"
format = "date"

[properties.metadata.properties.completed]
type = "string"
format = "date"

[properties.metadata.properties.maintainer]
type = "string"

[properties.metadata.properties.license]
type = "string"

[properties.metadata.properties.language_primary]
type = "string"

[properties.metadata.properties.languages_used]
type = "array"

[properties.metadata.properties.languages_used.items]
type = "string"

# ─────────────────────────────────────────────────────────────────────────────
# STATE
# ─────────────────────────────────────────────────────────────────────────────

[properties.state]
type = "object"

[properties.state.properties.completion_percent]
type = "integer"
minimum = 0
maximum = 100

[properties.state.properties.stability]
type = "string"
enum = [
  "experimental",
  "unstable",
  "mostly-stable",
  "stable",
  "hardened"
]

[properties.state.properties.active_development]
type = "boolean"

[properties.state.properties.technical_debt]
type = "string"
enum = ["low", "moderate", "high"]

[properties.state.properties.maintenance_burden]
type = "string"
enum = ["low", "medium", "high"]

[properties.state.properties.known_gaps]
type = "array"

[properties.state.properties.known_gaps.items]
type = "string"

# ─────────────────────────────────────────────────────────────────────────────
# RUNTIME
# ─────────────────────────────────────────────────────────────────────────────

[properties.runtime]
type = "object"
required = ["platform"]

[properties.runtime.properties.platform]
type = "string"
enum = [
  "desktop",
  "server",
  "cli",
  "container",
  "web",
  "library"
]

[properties.runtime.properties.environment]
type = "string"
description = "Minimum OS or runtime environment required"

[properties.runtime.properties.services]
type = "array"

[properties.runtime.properties.services.items]
type = "string"

[properties.runtime.properties.storage]
type = "array"

[properties.runtime.properties.storage.items]
type = "string"

# ─────────────────────────────────────────────────────────────────────────────
# CAPABILITIES
# ─────────────────────────────────────────────────────────────────────────────

[properties.capabilities]
type = "object"
additionalProperties = { type = "boolean" }
description = "Boolean flags describing what this application can do"

# ─────────────────────────────────────────────────────────────────────────────
# RELEASE  (required by the Desktop Application Release Standard)
# ─────────────────────────────────────────────────────────────────────────────

[properties.release]
type = "object"
required = ["version", "name", "date", "installer", "verified"]
description = "The canonical release record for the current verified or published version. Must be updated as part of every release — never describes an unreleased version."

[properties.release.properties.status]
type = "string"
enum = ["draft", "candidate", "local-verified", "published", "superseded", "withdrawn"]
description = "Lifecycle state of this release. 'draft': planned, not yet built. 'candidate': built and under verification. 'local-verified': packaged and verified locally but not publicly distributed. 'published': public artifact available. 'superseded': replaced by a newer release. 'withdrawn': retracted after publication (see Section 14 of the standard)."

[properties.release.properties.version]
type = "string"
description = "Semantic version of this release (MAJOR.MINOR.PATCH). Must match project.version."

[properties.release.properties.name]
type = "string"
description = "Full release name including theme: 'AppName vX.Y.Z — Theme Name'"

[properties.release.properties.date]
type = "string"
format = "date"
description = "ISO 8601 date the release was locally verified or published"

[properties.release.properties.installer]
type = "object"
required = ["path", "runtime", "package_version", "sha256"]
description = "Installer artifact metadata. sha256 is the minimum integrity requirement."

[properties.release.properties.installer.properties.path]
type = "string"
description = "Path to installer artifact relative to project root (e.g. 'artifacts/installer/AppName-1.0.0.0-win-x64.msi')"

[properties.release.properties.installer.properties.runtime]
type = "string"
enum = ["win-x64", "win-arm64", "win-x86"]
description = "Target runtime identifier"

[properties.release.properties.installer.properties.package_version]
type = "string"
description = "Four-part Windows version string (MAJOR.MINOR.PATCH.0)"

[properties.release.properties.installer.properties.size_bytes]
type = "integer"
description = "Installer file size in bytes"

[properties.release.properties.installer.properties.sha256]
type = "string"
description = "SHA-256 hash of the installer artifact — uppercase hex, no separators. Must match the release document."

[properties.release.properties.installer.properties.blake3]
type = "string"
description = "Optional BLAKE3 hash. Publishable releases should also use an ARHS .hashmanifest.toml with SHA256, BLAKE3-256, and KT128."

[properties.release.properties.installer.properties.signing]
type = "string"
description = "Signing/provenance status statement. Examples: 'microsoft-store-signed', 'self-signed-development', 'ca-signed', 'unsigned-internal', or another clear free-text statement. Never omit."

[properties.release.properties.verified]
type = "object"
required = ["date", "tests", "installer_build"]
description = "Factual record of what was tested and when, for the current release."

[properties.release.properties.verified.properties.date]
type = "string"
format = "date"
description = "Date verification was performed"

[properties.release.properties.verified.properties.tests]
type = "string"
description = "'[runner] passed N tests' — include runner name and test count"

[properties.release.properties.verified.properties.installer_build]
type = "string"
description = "Build script result: '[script] completed on [date]'"

[properties.release.properties.verified.properties.install_check]
type = "string"
description = "Install/uninstall verification result with window title and date"

[properties.release.properties.verified.properties.data_safety]
type = "string"
description = "Confirmation that user data was not affected by install/uninstall"

[properties.release.properties.verified.properties.upgrade_check]
type = "string"
description = "Upgrade verification result — 'existing data preserved after upgrade from vX.Y.Z' (if applicable)"

# ─────────────────────────────────────────────────────────────────────────────
# INTERFACES
# ─────────────────────────────────────────────────────────────────────────────

[properties.interfaces]
type = "array"

[properties.interfaces.items]
type = "object"

[properties.interfaces.items.properties.type]
type = "string"

[properties.interfaces.items.properties.path]
type = "string"

[properties.interfaces.items.properties.entrypoint]
type = "string"

[properties.interfaces.items.properties.auth]
type = "boolean"

[properties.interfaces.items.properties.provider]
type = "string"

# ─────────────────────────────────────────────────────────────────────────────
# RELATIONSHIPS
# ─────────────────────────────────────────────────────────────────────────────

[properties.relationships]
type = "object"

[properties.relationships.properties.depends_on_projects]
type = "array"

[properties.relationships.properties.depends_on_projects.items]
type = "string"

[properties.relationships.properties.used_by_projects]
type = "array"

[properties.relationships.properties.used_by_projects.items]
type = "string"

[properties.relationships.properties.external_dependencies]
type = "array"

[properties.relationships.properties.external_dependencies.items]
type = "string"

[properties.relationships.properties.related_projects]
type = "array"

[properties.relationships.properties.related_projects.items]
type = "string"

# ─────────────────────────────────────────────────────────────────────────────
# ARTIFACTS
# ─────────────────────────────────────────────────────────────────────────────

[properties.artifacts]
type = "object"

[properties.artifacts.properties.produces]
type = "array"

[properties.artifacts.properties.produces.items]
type = "string"

[properties.artifacts.properties.consumes]
type = "array"

[properties.artifacts.properties.consumes.items]
type = "string"

# ─────────────────────────────────────────────────────────────────────────────
# DATASETS
# ─────────────────────────────────────────────────────────────────────────────

[properties.datasets]
type = "array"

[properties.datasets.items]
type = "object"
required = ["name", "format"]

[properties.datasets.items.properties.name]
type = "string"

[properties.datasets.items.properties.description]
type = "string"

[properties.datasets.items.properties.format]
type = "string"

[properties.datasets.items.properties.size]
type = "string"

[properties.datasets.items.properties.location]
type = "string"

# ─────────────────────────────────────────────────────────────────────────────
# PERSISTENCE
# ─────────────────────────────────────────────────────────────────────────────

[properties.persistence]
type = "object"

[properties.persistence.properties.primary_store]
type = "string"

[properties.persistence.properties.secondary_stores]
type = "array"

[properties.persistence.properties.secondary_stores.items]
type = "string"

[properties.persistence.properties.storage_mode]
type = "string"

[properties.persistence.properties.supports_replication]
type = "boolean"

# ─────────────────────────────────────────────────────────────────────────────
# SCRIPTS
# ─────────────────────────────────────────────────────────────────────────────

[properties.scripts]
type = "array"

[properties.scripts.items]
type = "object"
required = ["name", "language"]

[properties.scripts.items.properties.name]
type = "string"

[properties.scripts.items.properties.language]
type = "string"

[properties.scripts.items.properties.role]
type = "string"

[properties.scripts.items.properties.status]
type = "string"

[properties.scripts.items.properties.version]
type = "integer"

# ─────────────────────────────────────────────────────────────────────────────
# GENERATION
# ─────────────────────────────────────────────────────────────────────────────

[properties.generation]
type = "object"

[properties.generation.properties.manifest_is_canonical]
type = "boolean"

[properties.generation.properties.generates_readme]
type = "boolean"

[properties.generation.properties.generates_writerside]
type = "boolean"

[properties.generation.properties.generates_jsonld]
type = "boolean"

[properties.generation.properties.generates_visualizations]
type = "boolean"

[properties.generation.properties.generates_embeddings]
type = "boolean"

[properties.generation.properties.generator]
type = "string"

# ─────────────────────────────────────────────────────────────────────────────
# DOCUMENTATION
# ─────────────────────────────────────────────────────────────────────────────

[properties.documentation]
type = "object"
description = "Paths to documentation files, relative to project root. All paths that exist must be valid."

[properties.documentation.properties.readme]
type = "string"
description = "Path to project README"

[properties.documentation.properties.release_notes]
type = "string"
description = "Path to release note for the current version (required)"

[properties.documentation.properties.release_checklist]
type = "string"
description = "Path to project release checklist"

[properties.documentation.properties.trust_model]
type = "string"
description = "Path to trust/security model document"

[properties.documentation.properties.threat_model]
type = "string"
description = "Path to threat model document"

[properties.documentation.properties.dependency_provenance]
type = "string"
description = "Path to dependency provenance document"

[properties.documentation.properties.build_guide]
type = "string"
description = "Path to build reproducibility guide"

[properties.documentation.properties.integrity_matrix]
type = "string"
description = "Path to integrity validation matrix"

[properties.documentation.properties.architecture_doc]
type = "string"

[properties.documentation.properties.writerside_topic]
type = "string"

[properties.documentation.properties.generated_sections]
type = "boolean"

# ─────────────────────────────────────────────────────────────────────────────
# SCHEMAS
# ─────────────────────────────────────────────────────────────────────────────

[properties.schemas]
type = "object"

[properties.schemas.properties.uses]
type = "array"

[properties.schemas.properties.uses.items]
type = "string"

[properties.schemas.properties.produces]
type = "array"

[properties.schemas.properties.produces.items]
type = "string"

[properties.schemas.properties.validates]
type = "array"

[properties.schemas.properties.validates.items]
type = "string"

# ─────────────────────────────────────────────────────────────────────────────
# SEMANTIC
# ─────────────────────────────────────────────────────────────────────────────

[properties.semantic]
type = "object"

[properties.semantic.properties.domain]
type = "string"

[properties.semantic.properties.primary_concepts]
type = "array"

[properties.semantic.properties.primary_concepts.items]
type = "string"

[properties.semantic.properties.related_domains]
type = "array"

[properties.semantic.properties.related_domains.items]
type = "string"

[properties.semantic.properties.cognitive_tags]
type = "array"

[properties.semantic.properties.cognitive_tags.items]
type = "string"

[properties.semantic.properties.complexity]
type = "string"

# ─────────────────────────────────────────────────────────────────────────────
# VISUAL
# ─────────────────────────────────────────────────────────────────────────────

[properties.visual]
type = "object"

[properties.visual.properties.theme]
type = "string"

[properties.visual.properties.primary_color]
type = "string"

[properties.visual.properties.semantic_role]
type = "string"

[properties.visual.properties.contains_svg_assets]
type = "boolean"

[properties.visual.properties.contains_scene_art]
type = "boolean"

# ─────────────────────────────────────────────────────────────────────────────
# OBSERVABILITY
# ─────────────────────────────────────────────────────────────────────────────

[properties.observability]
type = "object"

[properties.observability.properties.logs]
type = "boolean"

[properties.observability.properties.metrics]
type = "boolean"

[properties.observability.properties.health_checks]
type = "boolean"

[properties.observability.properties.event_stream]
type = "boolean"

[properties.observability.properties.telemetry]
type = "boolean"

# ─────────────────────────────────────────────────────────────────────────────
# DISTRIBUTION
# ─────────────────────────────────────────────────────────────────────────────

[properties.distribution]
type = "object"
description = "Distribution posture. Public Windows GUI releases default to Microsoft Store MSIX; sideloaded self-signed MSIX is development/test only."

[properties.distribution.properties.packaged]
type = "boolean"

[properties.distribution.properties.package_formats]
type = "array"

[properties.distribution.properties.package_formats.items]
type = "string"

[properties.distribution.properties.channel]
type = "string"
description = "Distribution channel, e.g. microsoft-store-msix, msix-sideload-dev, direct-msi-exe, internal, github-release, package-manager."

[properties.distribution.properties.signing_authority]
type = "string"
description = "Distribution signing or provenance authority, e.g. microsoft-store-signed, self-signed-development, ca-signed, unsigned-internal."

[properties.distribution.properties.portable]
type = "boolean"

[properties.distribution.properties.offline_capable]
type = "boolean"

[properties.distribution.properties.requires_installation]
type = "boolean"

# ─────────────────────────────────────────────────────────────────────────────
# LINKS
# ─────────────────────────────────────────────────────────────────────────────

[properties.links]
type = "object"

[properties.links.properties.repository]
type = "string"
format = "uri"

[properties.links.properties.homepage]
type = "string"
format = "uri"

[properties.links.properties.dashboard]
type = "string"
format = "uri"

# ─────────────────────────────────────────────────────────────────────────────
# STRUCTURE
# ─────────────────────────────────────────────────────────────────────────────

[properties.structure]
type = "object"

[properties.structure.properties.repo_path]
type = "string"

[properties.structure.properties.docs_path]
type = "string"

[properties.structure.properties.data_path]
type = "string"

# ─────────────────────────────────────────────────────────────────────────────
# AUTOMATION
# ─────────────────────────────────────────────────────────────────────────────

[properties.automation]
type = "object"

[properties.automation.properties.build]
type = "string"

[properties.automation.properties.deploy]
type = "string"

[properties.automation.properties.tasks]
type = "array"

[properties.automation.properties.tasks.items]
type = "string"

# ─────────────────────────────────────────────────────────────────────────────
# NOTES
# ─────────────────────────────────────────────────────────────────────────────

[properties.notes]
type = "object"
additionalProperties = true
description = "Free-form key/value notes. Use for project-specific metadata not covered by any other section."
