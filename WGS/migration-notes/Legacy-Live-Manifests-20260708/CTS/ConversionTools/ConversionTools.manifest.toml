[runtime]
platform = "cli"
environment = "Rust 1.70+, Python 3.10+, FFmpeg"
services = ["FFmpeg"]
storage = ["File system"]

[capabilities]
audio_conversion = true
audio_transcription = true
video_conversion = true
batch_processing = true
format_detection = true

[relationships]
