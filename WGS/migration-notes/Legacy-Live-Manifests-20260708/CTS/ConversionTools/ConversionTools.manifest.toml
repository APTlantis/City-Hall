semantic_role = "tool"
contains_svg_assets = false

[components]
"Audio" = "Rust-based audio format converter supporting multiple codec and container formats"
"CPU-Whisper" = "Python-based audio transcription using CPU-friendly Whisper models; supports AAC, FLAC, MP3, MP4, OGG, WAV, WebM, and more"
"VideoToMP4" = "Rust-based video converter normalizing various video formats to MP4 standard"
"in" = "Input directory for media files awaiting processing"

[distribution]
packaged = true
package_formats = ["rust-binary", "python-script"]
portable = true
offline_capable = true
requires_installation = false

[links]
homepage = "https://aptlantis.net"

[structure]
repo_path = "E:/ConversionTools"

[automation]
build = "cd Audio && cargo build --release && cd ../CPU-Whisper && pip install -r requirements.txt && cd ../VideoToMP4 && cargo build --release"
tasks = ["convert-audio", "transcribe-audio", "convert-video", "batch-process"]

[notes]
purpose = "Provide standalone media conversion and transcription tools grouped for ecosystem-wide content processing"
approach = "Each tool is independently executable but shares common patterns for integration into larger workflows"
design_philosophy = "Modular tools that handle specific conversions; can be chained or called individually as needed"
cpu_friendly = "Audio transcription uses Ollama's CPU-optimized Whisper implementation for offline processing"
