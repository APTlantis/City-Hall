[project]
id = "conversion-tools"
title = "ConversionTools"
type = "tool"
stage = "active"
version = "1.0.0"
description = "Suite of media conversion and transcription utilities. Converts audio formats, transcribes audio files to text using Whisper, and converts video files to MP4 format. Each tool is standalone but grouped to support media processing workflows."
